header: EntityAPI
entityType: IEntity
aggressiveInlining: true

namespace: Game
className: EntityAPI
directory: Assets/Game/Scripts/Gameplay/Tutorial/CodeGen

imports:
  - UnityEngine
  - Atomic.Entities
  - Atomic.Elements
  - System
  - Modules.Gameplay

tags:
  - Damageable

values:
  # 🧩 Core
  - GameObject: GameObject
  - Transform: Transform
  - Target: Transform
  - LifeTime: IValue<float>

  # 🌀 Movement
  - MoveSpeed: IValue<float>
  - MoveDirection: IReactiveVariable<Vector3>
  - MoveCondition: IExpression<bool>
  - MoveAction: IAction<Vector3, float>
  - RotationSpeed: IValue<float>

  # ⚔️ Combat
  - Weapon: IEntity
  - FirePoint: Transform
  - Damage: IValue<int>
  - FireAction: IAction
  - FireEvent: BaseEvent
  - FireCondition: IFunction<bool>

  # ❤️ Health
  - Health: ReactiveInt

  # ⚙️ Physics
  - CollisionReceiver: CollisionEventReceiver

  # 🎬 Animation
  - Animator: Animator
