header: EntityAPI
entityType: IEntity
aggressiveInlining: true

namespace: Game
className: EntityAPI
directory: Assets/Game/Scripts/Gameplay/CodeGen

imports:
  - UnityEngine
  - Atomic.Entities
  - Atomic.Elements
  - System
  - Modules.Gameplay

tags:
  - Damageable
  - Interactable

values:
  # 🧩 Core
  - GameObject: GameObject
  - Transform: Transform
  - Target: Transform
  - LifeTime: Cooldown
  - DestroyAction: IAction

  # 🌀 Movement
  - MoveSpeed: IValue<float>
  - MoveDirection: IReactiveVariable<Vector3>
  - MoveCondition: IExpression<bool>
  - MoveAction: IAction<Vector3, float>
  - RotationSpeed: IValue<float>

  # ⚔️ Combat
  - Ammo: Ammo
  - WeaponId: WeaponID
  - WeaponFireRate: Cooldown
  - Weapon: IReactiveVariable<IEntity>
  - WeaponRoot: Transform
  - FirePoint: Transform
  - Damage: IValue<int>
  - FireAction: IAction
  - FireEvent: BaseEvent
  - FireCondition: IExpression<bool>

  # ❤️ Health
  - Health: Health
  
  # ⚙️ Physics
  - CollisionReceiver: CollisionEventReceiver
  - TriggerEventReceiver: TriggerEventReceiver
  - RiggedBody: Rigidbody
  
  # 🎬 Animation
  - Animator: Animator
  
  # 🛠️ Interact
  - PickUpPrefab: SceneEntity
  - ShowUIAction: IAction<bool>
  - InteractAction: IAction<IEntity>
  - IsInteract: IReactiveVariable<bool>
  - UITransform: Transform
  - TargetInteractable: IReactiveVariable<IEntity>
    
    
