header: EntityAPI
entityType: IEntity
aggressiveInlining: true

namespace: Game
className: EntityAPI
directory: Assets/Game/Scripts/Gameplay/Tutorial/CodeGen

imports:
  - UnityEngine
  - Atomic.Entities
  - Atomic.Elements
  - System
  - Modules.Gameplay

tags:
  - Damageable
  - Interactable

values:
  # 🧩 Core
  - GameObject: GameObject
  - Transform: Transform
  - Target: Transform
  - LifeTime: IValue<float>

  # 🌀 Movement
  - MoveSpeed: IValue<float>
  - MoveDirection: IReactiveVariable<Vector3>
  - MoveCondition: IExpression<bool>
  - MoveAction: IAction<Vector3, float>
  - RotationSpeed: IValue<float>

  # ⚔️ Combat
  - Weapon: IReactiveVariable<IEntity>
  - WeaponRoot: Transform
  - PickUpPrefab: SceneEntity
  - FirePoint: Transform
  - Damage: IValue<int>
  - FireAction: IAction
  - FireEvent: BaseEvent
  - FireCondition: IFunction<bool>
  - Ammo: ReactiveInt

  # ❤️ Health
  - Health: ReactiveInt

  # ⚙️ Physics
  - CollisionReceiver: CollisionEventReceiver
  - TriggerEventReceiver: TriggerEventReceiver

  # 🎬 Animation
  - Animator: Animator
    
  - WeaponAnimator: RuntimeAnimatorController
  - FistAnimator: RuntimeAnimatorController
  
  # 🛠️ Interact
  - ShowUIAction: IAction<bool>
  - InteractAction: IAction<IEntity>
  - IsInteract: IReactiveVariable<bool>
  - UITransform: Transform
  - TargetInteractable: IReactiveVariable<IEntity>
    
    
