header: EntityAPI
entityType: IEntity
aggressiveInlining: true

namespace: Game
className: EntityAPI
directory: Assets/Game/Scripts/Gameplay/CodeGen

imports:
  - UnityEngine
  - Atomic.Entities
  - Atomic.Elements
  - System
  - Modules.Gameplay
  - HighlightPlus

tags:
  - Damageable
  - Interactable
  - Player
  - MeleeWeapon
  - RangeWeapon

values:
  # Core
  - EntityID: string
  - GameObject: GameObject
  - Transform: Transform
  - LifeTime: Cooldown
  - DestroyAction: IAction

  # Movement
  - MoveSpeed: IValue<float>
  - MoveDirection: IReactiveVariable<Vector3>
  - RotateDirection: IReactiveVariable<Vector3>
  - MoveCondition: IExpression<bool>
  - MoveAction: IAction<Vector3, float>
  - RotationSpeed: IValue<float>
  - Velocity: IReactiveVariable<float>

  # Combat
  - BulletPrefab: SceneEntity
  - ShellPrefab: SceneEntity
  - BulletHitPrefab: SceneEntity
  - Ammo: Ammo
  - WeaponId: WeaponID
  - WeaponCooldown: Cooldown
  - Weapon: IReactiveVariable<IEntity>
  - HandWeapon: IReactiveVariable<IEntity>
  - WeaponRoot: Transform
  - FirePoint: Transform
  - ShellPoint: Transform
  - Damage: IValue<int>
  - DamageRadius: IValue<float>
  - DamageLayer: LayerMask
  - DamageCastEnabled: IReactiveVariable<bool>
  - FireAction: IAction
  - FireEvent: BaseEvent
  - FireCondition: IExpression<bool>

  # Health
  - Health: Health
  - DeathEvent: BaseEvent
  - DeathAction: IAction
  - DamageTakenEvent: BaseEvent<TakeDamageArgs>
  - DeathTakenEvent: BaseEvent<TakeDamageArgs>
  
  # Physics
  - CollisionReceiver: CollisionEventReceiver
  - TriggerEventReceiver: TriggerEventReceiver
  - RiggedBody: Rigidbody
  
  # Animation
  - Animator: Animator
  - AnimationController: RuntimeAnimatorController
  - AnimationEventReceiver: AnimationEventReceiver
  
  # Interact
  - PickUpPrefab: SceneEntity
  - ShowUIAction: IAction<bool>
  - InteractAction: IAction<IEntity>
  - IsInteract: IReactiveVariable<bool>
  - UITransform: Transform
  - TargetInteractable: IReactiveVariable<IEntity>
  - PickUpEvent: BaseEvent
  - DropEvent: BaseEvent
  - PositionOffset: Vector3
  - Highlight: HighlightEffect
  
  # AI
  - PatrolPoints: Transform[]
  - Target: IReactiveVariable<IEntity>
  
  # Sound
  - AudioSource: AudioSource
  
  # Camera
  - CameraShakeArgs: CameraShakeArgs
  - CameraShakeEvent: BaseEvent<CameraShakeArgs>
  - CameraPoint: Transform
    
    
